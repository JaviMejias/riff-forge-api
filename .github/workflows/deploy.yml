name: Deploy backend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: deploy-backend-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run isolated tests
        run: npm test

  deploy:
    name: Deploy to Oracle
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          printf '%s\n' \
            'Host *' \
            '  BatchMode yes' \
            '  IdentitiesOnly yes' \
            '  StrictHostKeyChecking yes' \
            '  ConnectTimeout 20' \
            '  ServerAliveInterval 30' \
            '  ServerAliveCountMax 10' > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Update and restart backend
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          BACKEND_PATH: ${{ secrets.BACKEND_PATH }}
          COMPOSE_PATH: ${{ secrets.COMPOSE_PATH }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          printf -v backend_path '%q' "$BACKEND_PATH"
          printf -v compose_path '%q' "$COMPOSE_PATH"

          ssh -i ~/.ssh/id_ed25519 "${SSH_USER}@${SSH_HOST}" \
            "BACKEND_PATH=${backend_path} COMPOSE_PATH=${compose_path} DEPLOY_SHA=$DEPLOY_SHA bash -se" <<'REMOTE'
          set -euo pipefail

          cd "$COMPOSE_PATH"
          exec 9>.riff-forge-deploy.lock
          flock -w 1200 9
          cd "$BACKEND_PATH"
          test "$(git branch --show-current)" = "main"
          git pull --ff-only origin main
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

          cd "$COMPOSE_PATH"
          sudo -n docker compose build backend
          sudo -n docker compose run --rm --no-deps -T backend npm run db:migrate < /dev/null
          sudo -n docker compose up -d --no-deps backend
          sudo -n docker compose ps backend
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3001/health >/dev/null; then
              echo "Backend is responding"
              exit 0
            fi
            sleep 2
          done
          sudo -n docker logs --tail 100 riff_backend
          exit 1
          REMOTE
